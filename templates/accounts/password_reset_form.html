{% extends "store/base.html" %}
{% block title %}Forgot Password | Cartzo{% endblock %}
{% block content %}
<div class="container" style="max-width:520px;margin:50px auto;padding:25px;">
    <h1>Forgot Password?</h1>
    <p>Enter your registered email address. If an account matches, Django will send a reset link.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button">Send Reset Link</button>
    </form>
</div>
{% endblock %}
